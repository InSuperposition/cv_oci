# cv-build — the pipeline: cv_frontend@SHA -> CNB image in zot -> deployed by digest.
#
#   fetch -> build (buildpacks 0.6) -> smoke -> deploy
#
# Self-contained: no pipeline-utils, no cloned scripts. resolve is folded into
# the fetch step (SHA validation + frontend-contract.md path assertions).
# smoke/deploy are inline. Every image is a param fed from digests.cue.
#
# The app image is pushed to and pulled from ONE address:
# zot.cv-pipeline.svc.cluster.local:5000. On OrbStack that name resolves both
# in-cluster and from the Mac's Docker daemon (the kubelet's puller), so there
# is no two-address split. The one per-platform step is the daemon
# insecure-registries entry (docs/runbook.md).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cv-build
spec:
  params:
    # Full image refs (repo@sha256:...), fed from digests.cue via params.yaml /
    # bootstrap.sh. builder + run image must be the arm64 CHILD digest.
    - { name: builder-image, type: string }
    - { name: run-image, type: string }
    - { name: utility-image, type: string }
    - { name: kubectl-image, type: string }
    - { name: git-image, type: string }
    - { name: trivy-image, type: string }
    # trivy-db: bare sha256 digest of ghcr.io/aquasecurity/trivy-db:2 (Slice 3).
    # Pinned so the CVE verdict is reproducible.
    - { name: trivy-db, type: string }
    - { name: oras-image, type: string }
    - { name: frontend-repo, type: string }
    - { name: frontend-ref, type: string }
    # This repo. `smoke`/`deploy` render their manifests from modules/web-app/
    # (Slice 5b) — a step git-checks-out cv_oci@<pipeline-ref> for the module
    # source. pipeline-ref is a branch or a full SHA (reconstruction pins the SHA).
    - { name: pipeline-repo, type: string, default: "https://github.com/InSuperposition/cv_oci" }
    - { name: pipeline-ref, type: string, default: "main" }
    # The render image: scratch + the pinned timoni CLI (digests.cue timoniImage,
    # digests.env TIMONIIMAGE). Full ref: zot/timoni@sha256:...
    - { name: render-image, type: string }
    - { name: app-repo, type: string, default: "zot.cv-pipeline.svc.cluster.local:5000/cv" }
    - { name: insecure-registries, type: string, default: "zot.cv-pipeline.svc.cluster.local:5000" }
    - { name: namespace, type: string, default: cv-pipeline }
    - { name: contract-paths, type: string, default: "server.ts tsconfig.json package.json package-lock.json app/router.ts app/routes.ts app/assets.ts public" }
  workspaces:
    - { name: shared }
  results:
    - { name: app-image-digest, value: "$(tasks.build.results.APP_IMAGE_DIGEST)" }
    - { name: app-image-url, value: "$(tasks.build.results.APP_IMAGE_URL)" }
    # Slice 3: "pass" iff the scan task ran and found no fixable CRITICAL in the
    # app image or the run image, scanned against the pinned vuln-DB.
    - { name: cve-verdict, value: "$(tasks.scan.results.VERDICT)" }
    - { name: cve-db-digest, value: "$(tasks.scan.results.DB_DIGEST)" }
    - { name: sbom-components, value: "$(tasks.scan.results.SBOM_COMPONENTS)" }
  tasks:
    - name: fetch
      workspaces: [{ name: source, workspace: shared }]
      params:
        - { name: repo, value: "$(params.frontend-repo)" }
        - { name: sha, value: "$(params.frontend-ref)" }
        - { name: contract, value: "$(params.contract-paths)" }
        - { name: image, value: "$(params.git-image)" }
        - { name: config-repo, value: "$(params.pipeline-repo)" }
        - { name: config-ref, value: "$(params.pipeline-ref)" }
      taskSpec:
        params: [{ name: repo }, { name: sha }, { name: contract }, { name: image }, { name: config-repo }, { name: config-ref }]
        workspaces: [{ name: source }]
        steps:
          - name: clone-and-assert
            image: $(params.image)
            workingDir: $(workspaces.source.path)
            # Slice 1.7: every inline step runs uid 1000, PSA-restricted, so
            # cv-pipeline can enforce `restricted`. `set-security-context=true`
            # only covers Tekton's own injected containers, not these. The
            # anchor is reused by smoke / deploy / teardown below. For `fetch`
            # specifically, uid 1000 also means the checked-out tree is
            # 1000-owned from creation (with fsGroup 1000 on the podTemplate),
            # so the `build` task needs no root chown.
            securityContext: &restricted-sc
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile: { type: RuntimeDefault }
            script: |
              #!/bin/sh
              set -eu
              rm -rf app && mkdir app && cd app
              git init -q
              git remote add origin "$(params.repo)"
              # `git fetch` is the only network call in this step. Retry it on
              # TRANSIENT failures only — a single DNS/egress blip (macOS host
              # resolver + VPN-tunnel MTU chaos on the dev cluster, see
              # docs/runbook.md "fetch fails: Could not resolve host") must not
              # fail a whole 20-minute pipeline run. A bad ref still fails fast.
              n=0
              while :; do
                err="$(git fetch -q --depth 1 origin "$(params.sha)" 2>&1)" && break
                case "$err" in
                  *"Could not resolve host"*|*"Timeout"*|*"timed out"*|\
                  *"unable to access"*|*"Connection refused"*|*"Connection reset"*)
                    n=$((n + 1))
                    [ "$n" -lt 5 ] || { echo "git fetch: transient failures x5, giving up: $err" >&2; exit 1; }
                    echo "git fetch: transient failure, retry $n in $((n * 5))s: $err" >&2
                    sleep $((n * 5)) ;;
                  *)
                    echo "git fetch failed (not transient): $err" >&2; exit 1 ;;
                esac
              done
              git checkout -q FETCH_HEAD
              got="$(git rev-parse HEAD)"
              echo "cv_frontend @ $got"
              case "$(params.sha)" in
                "$got"|refs/*) : ;;
                *) [ ${#got} -eq 40 ] || { echo "not a full sha: $got" >&2; exit 1; } ;;
              esac
              # frontend-contract.md path assertions (resolve, folded in)
              miss=""
              for p in $(params.contract); do [ -e "$p" ] || miss="$miss $p"; done
              [ -z "$miss" ] || { echo "cv_frontend contract violation, missing:$miss" >&2; exit 1; }
              echo "contract ok"
              # Strip .git before the buildpack copies the source tree into the
              # app layer. .git/index (stat cache) and .git/logs/HEAD (reflog
              # timestamps) both carry this-run wall-clock data, and left in
              # place they are the sole source of app-layer nondeterminism
              # (Slice 2 reproducibility test / docs/designs/buildpacks-pivot.md).
              # The SHA is already captured above; nothing downstream needs .git.
              rm -rf .git

          # Slice 5b: check out cv_oci itself for modules/web-app/. The `smoke`
          # and `deploy` tasks `timoni build` the module from ./config/modules/.
          # Only modules/ is kept; .git is stripped (same reproducibility reason
          # as the app tree). config-ref is a branch or a full SHA.
          - name: fetch-config
            image: $(params.image)
            workingDir: $(workspaces.source.path)
            securityContext: *restricted-sc
            script: |
              #!/bin/sh
              set -eu
              rm -rf config && mkdir config && cd config
              git init -q
              git remote add origin "$(params.config-repo)"
              n=0
              while :; do
                err="$(git fetch -q --depth 1 origin "$(params.config-ref)" 2>&1)" && break
                case "$err" in
                  *"Could not resolve host"*|*"Timeout"*|*"timed out"*|\
                  *"unable to access"*|*"Connection refused"*|*"Connection reset"*)
                    n=$((n + 1))
                    [ "$n" -lt 5 ] || { echo "git fetch (config): transient failures x5: $err" >&2; exit 1; }
                    echo "git fetch (config): retry $n in $((n * 5))s: $err" >&2
                    sleep $((n * 5)) ;;
                  *) echo "git fetch (config) failed (not transient): $err" >&2; exit 1 ;;
                esac
              done
              git checkout -q FETCH_HEAD
              got="$(git rev-parse HEAD)"
              # keep only modules/ (the render input); drop everything else
              find . -mindepth 1 -maxdepth 1 ! -name modules -exec rm -rf {} +
              [ -f modules/web-app/timoni.cue ] || { echo "modules/web-app/ missing from config-ref $(params.config-ref)" >&2; exit 1; }
              echo "config: modules/ from $(params.config-repo) @ $got"

    - name: build
      runAfter: [fetch]
      taskRef: { name: buildpacks }
      workspaces: [{ name: source, workspace: shared }]
      params:
        - { name: APP_IMAGE, value: "$(params.app-repo):git-$(params.frontend-ref)" }
        - { name: BUILDER_IMAGE, value: "$(params.builder-image)" }
        - { name: RUN_IMAGE, value: "$(params.run-image)" }
        - { name: UTILITY_IMAGE, value: "$(params.utility-image)" }
        - { name: SOURCE_SUBPATH, value: "app" }
        - { name: SKIP_RESTORE, value: "true" }
        - { name: CNB_INSECURE_REGISTRIES, value: "$(params.insecure-registries)" }
        - { name: CNB_PLATFORM_API, value: "0.9" }

    # Slice 3 — CVE gate + CycloneDX SBOM. Trivy scans the built app image and
    # the run image against a digest-pinned vuln-DB, and authors a CycloneDX
    # SBOM from the app image (heroku/builder:24 emits none of its own).
    # `smoke`/`deploy` run only if the gate passes AND the SBOM is well-formed.
    # Policy: fail on a currently-fixable CRITICAL (no baseline ledger). The
    # verdict is reproducible — (app digest, DB digest) determines it.
    - name: scan
      runAfter: [build]
      workspaces: [{ name: source, workspace: shared }]
      params:
        - { name: app-ref, value: "$(params.app-repo)@$(tasks.build.results.APP_IMAGE_DIGEST)" }
        - { name: app-digest, value: "$(tasks.build.results.APP_IMAGE_DIGEST)" }
        - { name: run-image, value: "$(params.run-image)" }
        - { name: trivy-image, value: "$(params.trivy-image)" }
        - { name: trivy-db, value: "$(params.trivy-db)" }
        - { name: oras-image, value: "$(params.oras-image)" }
      taskSpec:
        params: [{ name: app-ref }, { name: app-digest }, { name: run-image }, { name: trivy-image }, { name: trivy-db }, { name: oras-image }]
        workspaces: [{ name: source }]
        results:
          - { name: VERDICT, description: "pass | fail-critical" }
          - { name: DB_DIGEST, description: "the pinned trivy-db digest the verdict is against" }
          - { name: SBOM_COMPONENTS, description: "component count in the CycloneDX SBOM" }
        steps:
          - name: scan
            image: $(params.trivy-image)
            securityContext: *restricted-sc  # Slice 1.7
            script: |
              #!/bin/sh
              set -eu
              WS="$(workspaces.source.path)"
              CACHE="$WS/.trivycache"
              DB_REF="ghcr.io/aquasecurity/trivy-db@$(params.trivy-db)"
              # CVE policy — keep in sync with tests/cve-gate-blocks-fixable-critical/ (grep guard).
              POLICY="--severity CRITICAL --ignore-unfixed --exit-code 1"
              export TRIVY_CACHE_DIR="$CACHE"
              mkdir -p "$CACHE"

              # Pinned DB, fetched once. Every scan below is --skip-db-update, so
              # the verdict depends only on (image digest, DB digest).
              trivy image --quiet --download-db-only --db-repository "$DB_REF"

              # Scan a ref for fixable CRITICALs; write the full JSON report;
              # return trivy's exit code (1 = found) without aborting the step.
              scan_ref() {
                _ref="$1"; _out="$2"; _insecure="${3:-}"
                set +e
                trivy image --quiet --skip-db-update $POLICY \
                  --format json --output "$_out" $_insecure "$_ref"
                _rc=$?
                set -e
                return $_rc
              }

              app_rc=0; run_rc=0
              scan_ref "$(params.app-ref)"  "$WS/scan-app.json" --insecure || app_rc=$?
              scan_ref "$(params.run-image)" "$WS/scan-run.json"             || run_rc=$?
              cve_verdict=pass
              [ "$app_rc" -eq 0 ] && [ "$run_rc" -eq 0 ] || cve_verdict=fail-critical

              # CycloneDX SBOM of the app image, authored by the scanner.
              SBOM="$WS/sbom.cdx.json"
              trivy image --quiet --skip-db-update --format cyclonedx \
                --output "$SBOM" --insecure "$(params.app-ref)"

              # Well-formed? names the Node runtime? names every production npm
              # dependency the checked-out app declares?
              sbom_check=ok
              grep -q '"bomFormat": *"CycloneDX"' "$SBOM" || sbom_check="fail:not-cyclonedx"
              grep -q '"name": *"node"'            "$SBOM" || sbom_check="fail:no-node"
              comp_count=$(grep -c '"bom-ref":' "$SBOM" || true)
              deps=$(sed -n '/"dependencies"[[:space:]]*:[[:space:]]*{/,/}/p' "$WS/app/package.json" \
                     | grep -oE '"[A-Za-z0-9@/_.-]+"[[:space:]]*:' \
                     | sed 's/[":[:space:]]//g' | grep -v '^dependencies$' || true)
              for d in $deps; do
                grep -q "\"name\": *\"${d##*/}\"" "$SBOM" || sbom_check="fail:missing-dep:$d"
              done

              cat > "$WS/cve-verdict.json" <<JSON
              {
                "schema": "cv-oci/cve-verdict/v1",
                "app_ref": "$(params.app-ref)",
                "app_digest": "$(params.app-digest)",
                "run_image": "$(params.run-image)",
                "db": "$DB_REF",
                "policy": "fixable-CRITICAL",
                "cve_verdict": "$cve_verdict",
                "sbom_check": "$sbom_check",
                "sbom_components": $comp_count,
                "app_report": "scan-app.json",
                "run_report": "scan-run.json",
                "sbom": "sbom.cdx.json"
              }
              JSON
              cat "$WS/cve-verdict.json"

              printf '%s' "$cve_verdict"        > "$(results.VERDICT.path)"
              printf '%s' "$(params.trivy-db)"  > "$(results.DB_DIGEST.path)"
              printf '%s' "$comp_count"         > "$(results.SBOM_COMPONENTS.path)"

              fail=0
              [ "$cve_verdict" = pass ] || { echo "CVE gate: fixable CRITICAL (app_rc=$app_rc run_rc=$run_rc)" >&2; fail=1; }
              [ "$sbom_check" = ok ]    || { echo "SBOM check: $sbom_check" >&2; fail=1; }
              [ "$comp_count" -ge 20 ]  || { echo "SBOM check: only $comp_count components" >&2; fail=1; }
              exit $fail
          # Slice 4 (T5): attach the SBOM + CVE-verdict as OCI 1.1 referrers to
          # the app digest — same discovery path as the Chains SLSA provenance.
          # Only runs if the scan step above passed (Tekton skips on failure).
          - name: referrers
            image: $(params.oras-image)
            securityContext: *restricted-sc  # Slice 1.7
            script: |
              #!/bin/sh
              set -eu
              REF="$(params.app-ref)"
              export ORAS_CACHE="$(workspaces.source.path)/.orascache"
              mkdir -p "$ORAS_CACHE"
              cd "$(workspaces.source.path)"   # oras attach rejects absolute file args
              oras attach --insecure --distribution-spec v1.1-referrers-api \
                --artifact-type application/vnd.cyclonedx+json \
                "$REF" sbom.cdx.json:application/vnd.cyclonedx+json
              oras attach --insecure --distribution-spec v1.1-referrers-api \
                --artifact-type application/vnd.cv-oci.cve-verdict.v1+json \
                "$REF" cve-verdict.json:application/json
              echo "referrers attached to $REF:"
              oras discover --insecure --format tree "$REF"

    # Slice 5b: the ephemeral smoke app is rendered from modules/web-app/ (an
    # instance named cv-smoke-<rid12>, selector {app: <name>}, plus the
    # cv-oci/smoke=<rid> label the finally teardown selects on) — same module
    # the real `deploy` uses, so smoke exercises the exact rendered shape.
    - name: smoke
      runAfter: [scan]
      workspaces: [{ name: source, workspace: shared }]
      params:
        - { name: image-ref, value: "$(params.app-repo)@$(tasks.build.results.APP_IMAGE_DIGEST)" }
        - { name: app-sha, value: "$(params.frontend-ref)" }
        - { name: namespace, value: "$(params.namespace)" }
        - { name: run-id, value: "$(context.pipelineRun.uid)" }
        - { name: instance, value: "cv-smoke-$(context.pipelineRun.uid)" }
        - { name: image, value: "$(params.kubectl-image)" }
        - { name: render-image, value: "$(params.render-image)" }
      taskSpec:
        params: [{ name: image-ref }, { name: app-sha }, { name: namespace }, { name: run-id }, { name: instance }, { name: image }, { name: render-image }]
        workspaces: [{ name: source }]
        steps:
          - name: write-values
            image: $(params.image)
            securityContext: *restricted-sc  # Slice 1.7
            script: |
              #!/bin/sh
              set -eu
              WS="$(workspaces.source.path)"
              mkdir -p "$WS/render/tmp"
              cat > "$WS/render/smoke-values.cue" <<EOF
              values: {
                image:          "$(params.image-ref)"
                appVersion:     "$(params.app-sha)"
                selectorLabels: {app: "$(params.instance)"}
                extraLabels:    {"cv-oci/smoke": "$(params.run-id)"}
              }
              EOF
          - name: render
            image: $(params.render-image)
            securityContext: *restricted-sc  # Slice 1.7
            # The render image is scratch + static timoni + static busybox
            # (/bin/sh). An explicit shebang means Tekton needs no registry
            # entrypoint lookup — the controller does not trust the self-signed
            # zot cert. TIMONI_CACHING=false + TMPDIR: scratch has no writable
            # $HOME or /tmp; a local-path build needs neither a cache nor much temp.
            script: |
              #!/bin/sh
              set -eu
              WS="$(workspaces.source.path)"
              export TMPDIR="$WS/render/tmp" TIMONI_CACHING=false
              /usr/local/bin/timoni build "$(params.instance)" \
                "$WS/config/modules/web-app" -n "$(params.namespace)" \
                -f "$WS/render/smoke-values.cue" > "$WS/render/smoke.yaml"
          - name: smoke
            image: $(params.image)
            securityContext: *restricted-sc  # Slice 1.7
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              WS="$(workspaces.source.path)"; NS="$(params.namespace)"
              NAME="$(params.instance)"; RID="$(params.run-id)"
              cleanup(){ kubectl -n "$NS" delete deploy,svc -l "cv-oci/smoke=$RID" --ignore-not-found --wait=false >/dev/null 2>&1 || true; }
              trap cleanup EXIT
              test -s "$WS/render/smoke.yaml" || { echo "render produced no manifest" >&2; exit 1; }
              kubectl -n "$NS" apply -f "$WS/render/smoke.yaml" >/dev/null
              kubectl -n "$NS" rollout status "deploy/$NAME" --timeout=180s
              url="http://${NAME}.${NS}.svc.cluster.local/healthz"
              for i in $(seq 1 10); do
                code="$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$url" || echo 000)"
                [ "$code" = "200" ] && { echo "smoke: /healthz 200"; exit 0; }
                echo "smoke attempt $i -> $code"; sleep 3
              done
              kubectl -n "$NS" logs "deploy/$NAME" --tail=30 || true
              echo "smoke: /healthz never 200" >&2; exit 1

    # Slice 5b: the real `cv` Deployment + Service are rendered from
    # modules/web-app/ (instance `cv`, appVersion = the cv_frontend SHA). Same
    # module `smoke` rendered — the smoke pass proved this exact shape one step
    # earlier. deploy-by-digest is unchanged: the image ref is the build result.
    - name: deploy
      runAfter: [smoke]
      workspaces: [{ name: source, workspace: shared }]
      params:
        - { name: image-ref, value: "$(params.app-repo)@$(tasks.build.results.APP_IMAGE_DIGEST)" }
        - { name: image-digest, value: "$(tasks.build.results.APP_IMAGE_DIGEST)" }
        - { name: app-sha, value: "$(params.frontend-ref)" }
        - { name: namespace, value: "$(params.namespace)" }
        - { name: pipelinerun, value: "$(context.pipelineRun.name)" }
        - { name: image, value: "$(params.kubectl-image)" }
        - { name: render-image, value: "$(params.render-image)" }
      taskSpec:
        params: [{ name: image-ref }, { name: image-digest }, { name: app-sha }, { name: namespace }, { name: pipelinerun }, { name: image }, { name: render-image }]
        workspaces: [{ name: source }]
        steps:
          - name: write-values
            image: $(params.image)
            securityContext: *restricted-sc  # Slice 1.7
            script: |
              #!/bin/sh
              set -eu
              WS="$(workspaces.source.path)"; DIG="$(params.image-digest)"
              printf '%s' "$DIG" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "bad digest: $DIG" >&2; exit 1; }
              mkdir -p "$WS/render/tmp"
              cat > "$WS/render/deploy-values.cue" <<EOF
              values: {
                image:       "$(params.image-ref)"
                appVersion:  "$(params.app-sha)"
                extraLabels: {"app.kubernetes.io/part-of": "cv-oci"}
              }
              EOF
          - name: render
            image: $(params.render-image)
            securityContext: *restricted-sc  # Slice 1.7
            # scratch + static timoni + static busybox — see the `smoke` render step.
            script: |
              #!/bin/sh
              set -eu
              WS="$(workspaces.source.path)"
              export TMPDIR="$WS/render/tmp" TIMONI_CACHING=false
              /usr/local/bin/timoni build cv \
                "$WS/config/modules/web-app" -n "$(params.namespace)" \
                -f "$WS/render/deploy-values.cue" > "$WS/render/deploy.yaml"
          - name: deploy
            image: $(params.image)
            securityContext: *restricted-sc  # Slice 1.7
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              WS="$(workspaces.source.path)"; NS="$(params.namespace)"
              IMG="$(params.image-ref)"; DIG="$(params.image-digest)"
              APP_SHA="$(params.app-sha)"; PR="$(params.pipelinerun)"
              test -s "$WS/render/deploy.yaml" || { echo "render produced no manifest" >&2; exit 1; }
              prev="$(kubectl -n "$NS" get deploy/cv -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo none)"
              kubectl -n "$NS" apply -f "$WS/render/deploy.yaml" >/dev/null
              kubectl -n "$NS" rollout status deploy/cv --timeout=180s
              url="http://cv.${NS}.svc.cluster.local/healthz"
              code=000
              for i in $(seq 1 10); do
                code="$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$url" 2>/dev/null || echo 000)"
                [ "$code" = "200" ] && break
                echo "deploy probe $i -> $code"; sleep 3
              done
              [ "$code" = "200" ] || { kubectl -n "$NS" get ep cv -o wide >&2 || true; echo "deploy: /healthz -> $code" >&2; exit 1; }
              kubectl -n "$NS" create configmap cv-deploy-state \
                --from-literal=current_image="$IMG" \
                --from-literal=current_digest="$DIG" \
                --from-literal=previous="$prev" \
                --from-literal=app_sha="$APP_SHA" \
                --from-literal=pipelinerun="$PR" \
                --from-literal=updated="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --dry-run=client -o yaml | kubectl -n "$NS" apply -f - >/dev/null
              echo "deploy: cv @ $DIG serving /healthz 200"
  finally:
    - name: smoke-teardown
      params:
        - { name: run-id, value: "$(context.pipelineRun.uid)" }
        - { name: namespace, value: "$(params.namespace)" }
        - { name: image, value: "$(params.kubectl-image)" }
      taskSpec:
        params: [{ name: run-id }, { name: namespace }, { name: image }]
        steps:
          - name: teardown
            image: $(params.image)
            securityContext: *restricted-sc  # Slice 1.7
            script: |
              #!/usr/bin/env bash
              kubectl -n "$(params.namespace)" delete deploy,svc -l "cv-oci/smoke=$(params.run-id)" --ignore-not-found --wait=false || true
