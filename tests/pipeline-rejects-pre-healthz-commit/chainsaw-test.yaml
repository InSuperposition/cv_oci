# pipeline-rejects-pre-healthz-commit — negative scenario 2 (was negative.sh).
#
# cv_frontend commit 0bbc684 ("Initial commit") builds fine but has no /healthz
# route, so `smoke` must fail its GET /healthz, `deploy` must be skipped, the
# `finally` smoke-teardown must still run, and nothing may reach a `cv` Deployment.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pipeline-rejects-pre-healthz-commit
spec:
  concurrent: false
  steps:
    - name: run-with-the-pre-healthz-commit
      try:
        # Per-stage pipeline RBAC, ($namespace)-templated. Replaces the retired
        # in-script rewrite of manifests/rbac.yaml (`s/cv-pipeline/$NS/` piped to apply).
        - apply:
            file: ../_resources/pipeline-rbac.yaml
        - apply:
            file: ../../tasks/buildpacks.yaml
        - apply:
            file: ../../pipeline/pipeline.yaml
        - command:
            entrypoint: ../_resources/create-pipelinerun.sh
            env:
              - name: NS
                value: ($namespace)
              - name: ACCEPTANCE_LABEL
                value: pipeline-rejects-pre-healthz-commit
              - name: FRONTEND_REF
                value: "0bbc68418ce92048a85b8b18afe1dcfe6204bb83"

    - name: pipeline-fails
      try:
        - assert:
            timeout: 25m
            resource:
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              metadata:
                name: run
                namespace: ($namespace)
              status:
                (conditions[?type == 'Succeeded']):
                  - status: 'False'

    - name: build-passed-smoke-failed-deploy-skipped-teardown-ran
      try:
        - command:
            entrypoint: ./read-task-reasons.sh
            env:
              - name: NS
                value: ($namespace)
            outputs:
              - name: r
                value: (json_parse($stdout))
        - assert:
            resource:
              ($r.build): Succeeded
              (length($r.smoke) > `0`): true
              ($r.smoke != 'Succeeded'): true
              ($r.teardown): Succeeded
        - error:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                labels:
                  tekton.dev/pipelineTask: deploy
                  tekton.dev/pipelineRun: run

    - name: nothing-deployed-no-smoke-leak
      try:
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cv
        - command:
            entrypoint: ../_resources/count-smoke-leftovers.sh
            env:
              - name: NS
                value: ($namespace)
            outputs:
              - name: leak
                value: (json_parse($stdout))
        - assert:
            resource:
              ($leak.leftovers): 0
