# Slice 1.5 — per-stage least-privilege ServiceAccounts.
#
# The pipeline has four task stages plus one finally task. They do NOT need the
# same access, so each runs as its own identity (wired in the PipelineRun via
# spec.taskRunSpecs; the run's taskRunTemplate.serviceAccountName defaults the
# rest to cv-build-sa):
#
#   fetch, build        -> cv-build-sa    no K8s API calls at all; no token
#   smoke, smoke-teardown -> cv-smoke-sa  ephemeral Deployment/Service churn
#   deploy              -> cv-deploy-sa   the real `cv` Deployment/Service +
#                                         the cv-deploy-state ConfigMap
#
# What is deliberately NOT granted anywhere: secrets, the buildpacks task's
# `dockerconfig` workspace (the zot seed is unauthenticated — no Secret to
# mount), and Job/batch access (smoke uses a Deployment, not a Job). The
# `prepare` root step is a PodSecurity concern tracked in docs/debt.md, not an
# RBAC one.
#
# Slice 5a — cv-smoke-role and cv-deploy-role are ClusterRoles (they were
# byte-identical in every namespace). The rules live here once; the namespaced
# ServiceAccounts + RoleBindings below are for the real cv-pipeline namespace,
# and the acceptance tests re-create the same 5 namespaced objects in their
# ephemeral namespace from tests/_resources/pipeline-rbac.yaml (a Chainsaw
# ($namespace)-templated copy — no `sed`). The two files share these ClusterRoles.

# --- smoke (+ finally teardown): ephemeral run-scoped app --------------------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cv-smoke-role
rules:
  # create the throwaway Deployment/Service, wait on rollout, delete on teardown
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # `kubectl logs deploy/<smoke>` on failure
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
# --- deploy: the real `cv` Deployment/Service + deploy-state pointer ---------
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cv-deploy-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # cv-deploy-state: current/previous digest + app-sha + PipelineRun pointer
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # `kubectl get ep cv` on a failed rollout
  - apiGroups: [""]
    resources: ["endpoints", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
# --- fetch + build: no cluster access ---------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cv-build-sa
  namespace: cv-pipeline
# git clone + the CNB lifecycle creator never touch the Kubernetes API. No
# RoleBinding, and no mounted token.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cv-smoke-sa
  namespace: cv-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cv-smoke-rolebinding
  namespace: cv-pipeline
subjects:
  - kind: ServiceAccount
    name: cv-smoke-sa
    namespace: cv-pipeline
roleRef:
  kind: ClusterRole
  name: cv-smoke-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cv-deploy-sa
  namespace: cv-pipeline
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cv-deploy-rolebinding
  namespace: cv-pipeline
subjects:
  - kind: ServiceAccount
    name: cv-deploy-sa
    namespace: cv-pipeline
roleRef:
  kind: ClusterRole
  name: cv-deploy-role
  apiGroup: rbac.authorization.k8s.io
