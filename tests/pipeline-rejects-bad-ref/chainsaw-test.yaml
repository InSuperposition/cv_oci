# pipeline-rejects-bad-ref — negative scenario 1 (was scripts/test/negative.sh).
#
# A PipelineRun with a git ref that does not exist must fail at `fetch`, and
# nothing downstream may run.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pipeline-rejects-bad-ref
spec:
  concurrent: false
  steps:
    - name: run-with-a-bogus-ref
      try:
        # Per-stage pipeline RBAC, ($namespace)-templated. Replaces the retired
        # in-script rewrite of manifests/rbac.yaml (`s/cv-pipeline/$NS/` piped to apply).
        - apply:
            file: ../_resources/pipeline-rbac.yaml
        - apply:
            file: ../../tasks/buildpacks.yaml
        - apply:
            file: ../../pipeline/pipeline.yaml
        - command:
            entrypoint: ../_resources/create-pipelinerun.sh
            env:
              - name: NS
                value: ($namespace)
              - name: ACCEPTANCE_LABEL
                value: pipeline-rejects-bad-ref
              - name: FRONTEND_REF
                value: no-such-branch-xyz
              - name: PIPELINE_TIMEOUT
                value: 20m

    - name: pipeline-fails
      try:
        - assert:
            timeout: 20m
            resource:
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              metadata:
                name: run
                namespace: ($namespace)
              status:
                (conditions[?type == 'Succeeded']):
                  - status: 'False'

    - name: fetch-did-not-succeed-and-nothing-downstream-ran
      try:
        - command:
            entrypoint: ./read-fetch-taskrun-reason.sh
            env:
              - name: NS
                value: ($namespace)
        - error:
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                labels:
                  tekton.dev/pipelineTask: build
                  tekton.dev/pipelineRun: run
