apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: cv-pipeline
  labels:
    app.kubernetes.io/part-of: cv-oci
    app.kubernetes.io/component: registry
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC — never two pods
  selector:
    matchLabels:
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cv-oci
        app.kubernetes.io/component: registry
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          # ghcr.io/project-zot/zot-minimal-linux-arm64:v2.1.5 — digest from
          # digests.cue (images.zot), envsubst'd by bootstrap.sh.
          image: ghcr.io/project-zot/zot-minimal-linux-arm64@${ZOT}
          args: ["serve", "/etc/zot/config.json"]
          ports:
            - name: https
              containerPort: 5000
              # No hostPort. On OrbStack the VM loopback is forwarded to the
              # Mac loopback, so a hostPort on 127.0.0.1 is unreachable from the
              # cluster (and :5000 collides with macOS AirPlay Receiver anyway).
              # Instead: OrbStack routes `zot.cv-pipeline.svc.cluster.local:5000`
              # to BOTH the in-cluster network and the Mac's Docker daemon, so
              # one address serves push and pull. Slice 4: the port speaks TLS
              # (cert-manager). The kubelet still uses the daemon's
              # insecure-registries entry — it already means "accept an
              # unverified cert for this host", so no node change (docs/runbook.md).
          readinessProbe:
            httpGet: { path: /v2/, port: 5000, scheme: HTTPS }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v2/, port: 5000, scheme: HTTPS }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: storage, mountPath: /var/lib/registry }
            - { name: config, mountPath: /etc/zot }
            # Slice 4: cert-manager-issued serving cert (manifests/zot/certificate.yaml).
            - { name: tls, mountPath: /etc/zot-tls, readOnly: true }
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: zot-storage
        - name: config
          configMap:
            name: zot-config
        - name: tls
          secret:
            secretName: zot-tls
