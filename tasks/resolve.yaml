# cv-resolve — pin the source, fetch it, check the contract.
#
# Clones cv_oci (for the scripts) and cv_frontend (the app) into the shared
# workspace, resolves the ref to a full SHA, verifies it exists, asserts the
# cv_frontend contract (1c-A). Emits app-sha + source-date-epoch as results.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cv-resolve
spec:
  params:
    - { name: utils-image, type: string }
    - { name: frontend-repo, type: string }
    - { name: frontend-ref, type: string, default: main }
    - { name: oci-repo, type: string }
    - { name: oci-ref, type: string, default: main }
  results:
    - { name: app-sha, description: full cv_frontend commit SHA }
    - { name: source-date-epoch, description: cv_frontend commit timestamp (epoch) }
  workspaces:
    - { name: shared }
  stepTemplate:
    image: $(params.utils-image)
    workingDir: $(workspaces.shared.path)
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }
  steps:
    - name: clone-oci
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        rm -rf cvoci
        git clone --quiet "$(params.oci-repo)" cvoci
        git -C cvoci checkout --quiet "$(params.oci-ref)"
        echo "cvoci at $(git -C cvoci rev-parse HEAD)"
    - name: resolve-and-fetch
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        APP_SHA="$(cvoci/scripts/resolve-sha.sh "$(params.frontend-repo)" "$(params.frontend-ref)")"
        rm -rf src
        git clone --quiet "$(params.frontend-repo)" src
        git -C src checkout --quiet "$APP_SHA" \
          || { echo "APP_SHA $APP_SHA not found in cv_frontend" >&2; exit 1; }
        [ "$(git -C src rev-parse HEAD)" = "$APP_SHA" ] \
          || { echo "checkout mismatch" >&2; exit 1; }
        cvoci/scripts/assert-frontend-contract.sh src
        printf '%s' "$APP_SHA" > "$(results.app-sha.path)"
        git -C src show -s --format=%ct HEAD | tr -d '\n' > "$(results.source-date-epoch.path)"
        echo "resolved $(params.frontend-ref) -> $APP_SHA"
