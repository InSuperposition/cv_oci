apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: cv-pipeline
  labels:
    app.kubernetes.io/part-of: cv-oci
    app.kubernetes.io/component: registry
data:
  config.json: |
    {
      "storage": { "rootDirectory": "/var/lib/registry" },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "tls": { "cert": "/etc/zot-tls/tls.crt", "key": "/etc/zot-tls/tls.key" }
      },
      "log": { "level": "info" }
    }
