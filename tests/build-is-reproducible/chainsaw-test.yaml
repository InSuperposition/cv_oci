# build-is-reproducible — Slice 2 reproducibility (was scripts/test/repro.sh).
#
# Build the pinned cv_frontend fixture SHA twice, independently — separate
# ephemeral namespaces, separate zot repos, no shared cache — and assert the
# CNB lifecycle's own content-addressed layer hashes agree:
#   - app-layer diffID   io.buildpacks.lifecycle.metadata .app[0].sha
#   - SBOM-layer diffID  io.buildpacks.lifecycle.metadata .sbom.sha
# Bonus (not load-bearing): the two outer image digests also match.
#
# One test, two PipelineRuns both named `run`. Chainsaw allocates one ephemeral
# namespace; setup-second-namespace.sh stands up the second (<ns>-b) and the
# last step's finally: deletes it. No shell in this file.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: build-is-reproducible
spec:
  concurrent: false
  steps:
    - name: start-two-independent-builds
      try:
        # NS1 — the Chainsaw-managed ephemeral namespace.
        - apply:
            file: ../_resources/pipeline-rbac.yaml
        - apply:
            file: ../../tasks/buildpacks.yaml
        - apply:
            file: ../../pipeline/pipeline.yaml
        - command:
            entrypoint: ../_resources/copy-zot-ca-to-namespace.sh
            env:
              - name: NS
                value: ($namespace)
        - command:
            entrypoint: ../_resources/create-pipelinerun.sh
            env:
              - name: NS
                value: ($namespace)
              - name: ACCEPTANCE_LABEL
                value: build-is-reproducible
        # NS2 — a second, independent namespace this test creates.
        - command:
            entrypoint: ./setup-second-namespace.sh
            env:
              - name: SECOND_NS
                value: (join('-', [($namespace), 'b']))
        - command:
            entrypoint: ../_resources/create-pipelinerun.sh
            env:
              - name: NS
                value: (join('-', [($namespace), 'b']))
              - name: ACCEPTANCE_LABEL
                value: build-is-reproducible

    - name: both-builds-succeed
      try:
        - command:
            entrypoint: ../_resources/wait-for-pipelinerun.sh
            timeout: 25m
            env:
              - name: NAME
                value: run
              - name: NS
                value: ($namespace)
        - command:
            entrypoint: ../_resources/wait-for-pipelinerun.sh
            timeout: 25m
            env:
              - name: NAME
                value: run
              - name: NS
                value: (join('-', [($namespace), 'b']))

    - name: layer-hashes-agree
      try:
        - command:
            entrypoint: ./derive-layer-hashes.sh
            env:
              - name: NS1
                value: ($namespace)
      finally:
        - delete:
            ref:
              apiVersion: v1
              kind: Namespace
              name: (join('-', [($namespace), 'b']))
