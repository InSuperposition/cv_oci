# cv-build — install, verify, prune, and lay out the release tree.
#
# Runs in node:24-bookworm-slim (debian/glibc, arm64) — the app's native deps
# (oxc-transform, esbuild, lightningcss) ship per-libc bindings that must match
# the distroless runtime (docs/assignment-findings.md).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cv-build
spec:
  params:
    - { name: build-image, type: string }
  workspaces:
    - { name: shared }
  steps:
    - name: install-verify-prune
      image: $(params.build-image)
      workingDir: $(workspaces.shared.path)/src
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000            # node:slim 'node' user
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        seccompProfile: { type: RuntimeDefault }
      env:
        - { name: HOME, value: /tmp }
        - { name: npm_config_cache, value: /tmp/.npm }
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        npm ci --no-audit --no-fund
        npm run typecheck
        npm test
        npm audit signatures
        npm ci --omit=dev --no-audit --no-fund
    - name: lay-out-release-tree
      image: $(params.build-image)
      workingDir: $(workspaces.shared.path)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        seccompProfile: { type: RuntimeDefault }
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        rm -rf release && mkdir -p release/app
        (cd src && cp -R server.ts tsconfig.json package.json package-lock.json \
           app public node_modules ../release/app/)
        find release/app -name '*.test.*' -delete
        cvoci/scripts/assert-release-tree.sh release/app
