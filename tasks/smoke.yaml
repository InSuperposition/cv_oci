# cv-smoke — run the assembled image in isolation, prove it serves /healthz,
# tear it down (always).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cv-smoke
spec:
  params:
    - { name: utils-image, type: string }
    - { name: image-tag, type: string }
    - { name: namespace, type: string }
    - { name: run-id, type: string }
  workspaces:
    - { name: shared }
  steps:
    - name: smoke
      image: $(params.utils-image)
      workingDir: $(workspaces.shared.path)
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        seccompProfile: { type: RuntimeDefault }
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        cvoci/scripts/smoke.sh "$(params.image-tag)" "$(params.namespace)" "$(params.run-id)"
