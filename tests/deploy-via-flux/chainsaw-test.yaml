# deploy-via-flux — the Slice 5c-A reconcile contract.
#
# Unlike the other suites this one runs against the tofu-PROVISIONED cluster:
# it needs the Flux source + kustomize controllers and the prod
# flux-system/cv-frontend OCIRepository + Kustomization (they are cluster-scoped,
# not per-test). It drives a real cv-build PipelineRun into cv-pipeline and
# asserts the GitOps half of deploy:
#   - the deploy task published an OCI manifest artifact and Tekton Chains
#     signed it async (sigstore-bundle referrer on the digest)
#   - the OCIRepository verifies that cosign signature -> Ready/SourceVerified
#   - the Kustomization applies the cv Deployment + Service into cv-pipeline at
#     the built image @sha256, 1/1 ready
#   - a manual replica-count patch on cv is reverted within one reconcile interval
#   - a tampered artifact pushed at a higher CalVer tag is rejected
#     (VerificationError) and the reconciled revision does not advance
#
# Precondition: `cd tofu && tofu apply`. The preflight step fails clean if Flux
# is absent. Every step targets fixed namespaces (cv-pipeline / flux-system)
# explicitly; Chainsaw's ephemeral namespace is allocated but unused. No shell
# in this file except two genuine mutation+poll scripts this directory owns.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: deploy-via-flux
spec:
  concurrent: false
  steps:
    - name: preflight-flux-is-provisioned
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: source-controller
                namespace: flux-system
              status:
                readyReplicas: 1
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kustomize-controller
                namespace: flux-system
              status:
                readyReplicas: 1
        - assert:
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: OCIRepository
              metadata:
                name: cv-frontend
                namespace: flux-system
        - assert:
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: cv-frontend
                namespace: flux-system

    - name: run-the-pipeline
      try:
        # Idempotent: PipelineRuns are immutable, so drop any prior run at this
        # deterministic name before creating a new one.
        - delete:
            ref:
              apiVersion: tekton.dev/v1
              kind: PipelineRun
              name: deploy-via-flux-run
              namespace: cv-pipeline
        - command:
            entrypoint: ./apply-pipeline-resources.sh
        - command:
            entrypoint: ../_resources/create-pipelinerun.sh
            env:
              - name: NS
                value: cv-pipeline
              - name: ACCEPTANCE_LABEL
                value: deploy-via-flux
              - name: RUN_NAME
                value: deploy-via-flux-run
              - name: APP_REPO
                value: zot.cv-pipeline.svc.cluster.local:5000/cv
              - name: DEPLOY_ARTIFACT_REPO
                value: zot.cv-pipeline.svc.cluster.local:5000/cv-frontend

    - name: pipeline-succeeds-and-publishes-a-signed-artifact
      try:
        - command:
            entrypoint: ../_resources/wait-for-pipelinerun.sh
            timeout: 25m
            env:
              - name: NAME
                value: deploy-via-flux-run
              - name: NS
                value: cv-pipeline
        - command:
            entrypoint: ./read-pipeline-results.sh
            outputs:
              - name: m
                value: (json_parse($stdout))
        - assert:
            resource:
              ($m.url): zot.cv-pipeline.svc.cluster.local:5000/cv-frontend
              (starts_with($m.digest, 'sha256:')): true
              (length($m.digest)): 71
        - command:
            # Chains signs async — poll (in the script) for the sigstore-bundle
            # referrer on the pushed digest.
            entrypoint: ../_resources/fetch-artifact-referrers.sh
            timeout: 6m
            env:
              - name: REF
                value: (join('@', [$m.url, $m.digest]))
            outputs:
              - name: sig
                value: (json_parse($stdout))
        - assert:
            resource:
              ($sig.signed): true

    - name: ocirepository-verifies-and-kustomization-applies-cv
      try:
        - command:
            entrypoint: ./read-pipeline-results.sh
            outputs:
              - name: m
                value: (json_parse($stdout))
        - assert:
            timeout: 4m
            resource:
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: OCIRepository
              metadata:
                name: cv-frontend
                namespace: flux-system
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
                (conditions[?type == 'SourceVerified']):
                  - status: 'True'
                # status.artifact.revision is "<tag>@<manifest sha256>" — it
                # must carry the digest this run's deploy task published.
                (contains(artifact.revision, $m.digest)): true
        - assert:
            timeout: 3m
            resource:
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: cv-frontend
                namespace: flux-system
              status:
                (conditions[?type == 'Ready']):
                  - status: 'True'
        - assert:
            timeout: 3m
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cv
                namespace: cv-pipeline
              spec:
                template:
                  spec:
                    (contains(containers[0].image, '@sha256:')): true
                    (contains(containers[0].image, $m.app_digest)): true
              status:
                readyReplicas: 1

    - name: drift-is-reverted
      try:
        # kustomization_interval is 5m; give it one full interval plus margin.
        - patch:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cv
                namespace: cv-pipeline
              spec:
                replicas: 3
        - assert:
            timeout: 6m
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: cv
                namespace: cv-pipeline
              spec:
                replicas: 1

    - name: tampered-artifact-is-rejected
      try:
        - command:
            entrypoint: ./push-tampered-artifact.sh
            timeout: 6m
            outputs:
              - name: t
                value: (json_parse($stdout))
        - assert:
            resource:
              ($t.seen_verification_failure): true
              ($t.revision_unchanged): true
  catch:
    - describe:
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: OCIRepository
    - describe:
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
    - podLogs:
        namespace: cv-pipeline
        selector: tekton.dev/pipeline=cv-build
        tail: 60
