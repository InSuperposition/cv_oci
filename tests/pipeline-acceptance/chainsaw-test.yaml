# pipeline-acceptance — the cv-build success contract (was scripts/test/e2e.sh).
#
# Runs the real Pipeline against the live cluster with the pinned cv_frontend
# fixture SHA, in an ephemeral PSA-`restricted` namespace, pushing to a
# run-scoped zot repo so it never clobbers the real `cv` image. Asserts:
#   - the pipeline succeeds and reports an app-image-digest of sha256:<64hex>
#   - Slice 3: CVE verdict is pass against the pinned trivy-db digest; SBOM >= 20 components
#   - Slice 4: Chains signed the build TaskRun; image signature + SLSA attestation
#     verify; provenance names the builder as a material; SBOM + verdict + bundle
#     referrers are present; a byte-mutated copy FAILS cosign verify
#   - Slice 5c: deploy renders modules/web-app/ and `flux push artifact`s it to
#     <zot>/<ns>-frontend:<CalVer>; the task emits manifests_IMAGE_URL (bare) +
#     manifests_IMAGE_DIGEST (sha256); the artifact exists in zot and Chains
#     signs it (sigstore-bundle referrer). The Flux reconcile of that artifact
#     is a separate suite (deploy-via-flux) — it needs the provisioned cluster.
#
# No shell in this file: the PipelineRun comes from the shared
# ../_resources/create-pipelinerun.sh, the wait from
# ../_resources/wait-for-pipelinerun.sh, and every data-gathering step runs one
# named script from this directory. Failure diagnostics come from the config's
# spec.error.catch (this suite runs in an ephemeral namespace).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: pipeline-acceptance
spec:
  concurrent: false
  steps:
    - name: run-the-pipeline
      try:
        # Per-stage pipeline RBAC, ($namespace)-templated. Replaces the retired
        # in-script rewrite of manifests/rbac.yaml (`s/cv-pipeline/$NS/` piped to apply).
        - apply:
            file: ../_resources/pipeline-rbac.yaml
        - apply:
            file: ../../tasks/buildpacks.yaml
        - apply:
            file: ../../pipeline/pipeline.yaml
        # 5c: the deploy task's `flux push artifact` step mounts ca.crt from
        # zot-tls (SSL_CERT_FILE) — copy that one key into the ephemeral namespace.
        - command:
            entrypoint: ../_resources/copy-zot-ca-to-namespace.sh
            env:
              - name: NS
                value: ($namespace)
        - command:
            entrypoint: ../_resources/create-pipelinerun.sh
            env:
              - name: NS
                value: ($namespace)
              - name: ACCEPTANCE_LABEL
                value: pipeline-acceptance

    - name: pipeline-succeeds
      try:
        - command:
            entrypoint: ../_resources/wait-for-pipelinerun.sh
            env:
              - name: NAME
                value: run
              - name: NS
                value: ($namespace)

    - name: manifest-artifact-published-and-signed
      try:
        - command:
            entrypoint: ./verify-manifest-artifact.sh
            timeout: 6m
            env:
              - name: NS
                value: ($namespace)

    - name: cve-gate-and-sbom
      try:
        - command:
            entrypoint: ./read-cve-and-sbom-results.sh
            env:
              - name: NS
                value: ($namespace)

    - name: no-smoke-leak
      try:
        # /healthz on the built image is proved by the `smoke` task inside the
        # pipeline (one step before deploy). Here: the ephemeral smoke instance
        # was torn down and left nothing behind.
        - command:
            entrypoint: ../_resources/count-smoke-leftovers.sh
            env:
              - name: NS
                value: ($namespace)

    - name: chains-signed
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: tekton.dev/v1
              kind: TaskRun
              metadata:
                labels:
                  tekton.dev/pipelineTask: build
                  tekton.dev/pipelineRun: run
                annotations:
                  chains.tekton.dev/signed: "true"

    - name: signature-attestation-referrers
      try:
        - command:
            entrypoint: ./verify-signature-and-referrers.sh
            env:
              - name: NS
                value: ($namespace)

    - name: tampered-copy-fails-verify
      try:
        - command:
            entrypoint: ./push-tampered-image.sh
            env:
              - name: NS
                value: ($namespace)
            check:
              # the final cosign verify MUST fail -> non-zero exit -> $error set
              ($error != null): true
