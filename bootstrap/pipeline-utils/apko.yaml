# pipeline-utils — the one image every cv_oci Task runs in.
# Built by bootstrap/build-pipeline-utils.sh with `apko` (no Dockerfile, no
# daemon). Wolfi packages are pinned to the APKINDEX snapshot captured in
# bootstrap/pipeline-utils/lock.json (apko lock).
#
# Tools:
#   bash git curl jq   - script runtime + resolve/contract checks
#   crane              - OCI assembly (crane append -> tarball), digests
#   cue                - read digests.cue in-cluster if needed
#   docker-cli         - `docker load` the assembled image into the OrbStack
#                        store (Slice 1 only; removed at Slice 3)
#   kubectl-1.35       - smoke + deploy Tasks (matches the OrbStack cluster)
#   nodejs-24 npm      - the build Task (npm ci / audit / test / typecheck)
#
# trivy is added at Slice 3, cosign at Slice 4.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle
    - coreutils        # du, df, cut, head, mktemp, seq, sha256sum, dirname...
    - grep
    - sed
    - gawk
    - findutils        # find
    - gnutar           # GNU tar for deterministic image layers (--sort/--mtime)
    - bash
    - git
    - curl
    - jq
    - crane
    - cue
    - docker-cli
    - kubectl-1.35
    - nodejs-24
    - npm

# kubectl-1.35 installs the binary as `kubectl-1.35`; give it the plain name.
paths:
  - path: /usr/bin/kubectl
    type: symlink
    source: /usr/bin/kubectl-1.35
    uid: 0
    gid: 0
    permissions: 0o777

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  # Default to nonroot. The assemble Task overrides to run as the group that
  # owns the mounted docker.sock (see tasks/assemble.yaml).
  run-as: 65532

entrypoint:
  command: /bin/bash

archs:
  - arm64

environment:
  PATH: /usr/local/bin:/usr/bin:/bin
