---
# Vendored from tektoncd/catalog task/buildpacks/0.6, converted to tekton.dev/v1.
# https://github.com/tektoncd/catalog/blob/main/task/buildpacks/0.6/buildpacks.yaml
#
# Local changes:
#   - apiVersion v1beta1 -> v1 (Tekton 1.15 primary storage is v1).
#   - The prepare/results step image is the UTILITY_IMAGE param, default fed
#     from digests.cue (images.cnbUtilityImage) — keeps digests.cue the SSOT.
#   - Added the CNB_INSECURE_REGISTRIES param, wired into the `create` step env
#     so the lifecycle creator can push to a plain-HTTP in-cluster registry.
#   - Added the CNB_PLATFORM_API param.
#   - The `results` step reads `digest` from report.toml's [image] table only
#     (section-aware awk), not a bare `grep digest` — the [build] table's
#     [[build.bom]] metadata can carry its own `digest` key. Fails loud if
#     [image].digest is absent (Rule 13). Covered by scripts/test/report-digest.bats.
#   - Slice 1.7: stepTemplate.securityContext runs every step uid 1000,
#     PSA-restricted; the `prepare` step's `chown -R` (its only root use) is
#     deleted — `fetch` writes the source tree as 1000 and fsGroup 1000 makes
#     the PVC + emptyDir volumes group-writable. No root anywhere in the task.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildpacks
  labels:
    app.kubernetes.io/version: "0.6"
  annotations:
    tekton.dev/categories: Image Build
    tekton.dev/pipelines.minVersion: "0.17.0"
    tekton.dev/tags: image-build
    tekton.dev/displayName: "Buildpacks"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    The Buildpacks task builds source into a container image and pushes it to a registry,
    using Cloud Native Buildpacks.

  workspaces:
    - name: source
      description: Directory where application source is located.
    - name: cache
      description: Directory where cache is stored (when no cache image is provided).
      optional: true
    - name: dockerconfig
      description: >-
        An optional workspace that allows providing a .docker/config.json file
        for Buildpacks lifecycle binary to access the container registry.
        The file should be placed at the root of the Workspace with name config.json.
      optional: true

  params:
    - name: APP_IMAGE
      description: The name of where to store the app image.
    - name: BUILDER_IMAGE
      description: The image on which builds will run (must include lifecycle and compatible buildpacks).
    - name: SOURCE_SUBPATH
      description: A subpath within the `source` input where the source to build is located.
      default: ""
    - name: ENV_VARS
      type: array
      description: Environment variables to set during _build-time_.
      default: []
    - name: PROCESS_TYPE
      description: The default process type to set on the image.
      default: "web"
    - name: RUN_IMAGE
      description: Reference to a run image to use.
      default: ""
    - name: CACHE_IMAGE
      description: The name of the persistent app cache image (if no cache workspace is provided).
      default: ""
    - name: SKIP_RESTORE
      description: Do not write layer metadata or restore cached layers.
      default: "false"
    - name: USER_ID
      description: The user ID of the builder image user.
      default: "1000"
    - name: GROUP_ID
      description: The group ID of the builder image user.
      default: "1000"
    - name: PLATFORM_DIR
      description: The name of the platform directory.
      default: empty-dir
    - name: CNB_INSECURE_REGISTRIES
      description: >-
        Comma-separated registry hosts the lifecycle should reach over plain HTTP.
        Local addition for the in-cluster plain-HTTP registry path.
      default: ""
    - name: CNB_PLATFORM_API
      description: The platform API version the lifecycle should use.
      default: "0.9"
    - name: UTILITY_IMAGE
      description: >-
        Image for the prepare/results steps (needs bash). Default fed from
        digests.cue images.cnbUtilityImage via params.yaml.
      default: docker.io/library/bash@sha256:b208215a4655538be652b2769d82e576bc4d0a2bb132144c060efc5be8c3f5d6

  results:
    - name: APP_IMAGE_DIGEST
      description: The digest of the built `APP_IMAGE`.
    - name: APP_IMAGE_URL
      description: The URL of the built `APP_IMAGE`.

  stepTemplate:
    env:
      - name: CNB_PLATFORM_API
        value: "$(params.CNB_PLATFORM_API)"
    # Slice 1.7 (docs/designs/buildpacks-pivot.md): every step runs uid 1000,
    # PSA-restricted. The `prepare` chown is gone — `fetch` writes the source
    # tree as 1000 and fsGroup 1000 (PipelineRun podTemplate) makes the PVC and
    # the emptyDir layers/platform volumes group-writable. The `create` step
    # already passes -uid=1000/-gid=1000 to the lifecycle creator.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }

  steps:
    - name: prepare
      image: $(params.UTILITY_IMAGE)
      args:
        - "--env-vars"
        - "$(params.ENV_VARS[*])"
      script: |
        #!/usr/bin/env bash
        set -e

        # Slice 1.7: the upstream task's `chown -R` on /layers, /tekton/home and
        # the source workspace is gone. Every step runs uid 1000 and fsGroup
        # 1000 (PipelineRun podTemplate) makes the PVC and the emptyDir volumes
        # group-owned 1000; `fetch` already writes the tree as 1000. A cache
        # workspace is never bound here (SKIP_RESTORE=true), and a root chown is
        # not possible under PSA `restricted` anyway.

        echo "> Parsing additional configuration..."
        parsing_flag=""
        envs=()
        for arg in "$@"; do
            if [[ "$arg" == "--env-vars" ]]; then
                echo "-> Parsing env variables..."
                parsing_flag="env-vars"
            elif [[ "$parsing_flag" == "env-vars" ]]; then
                envs+=("$arg")
            fi
        done

        echo "> Processing any environment variables..."
        ENV_DIR="/platform/env"

        echo "--> Creating 'env' directory: $ENV_DIR"
        mkdir -p "$ENV_DIR"

        for env in "${envs[@]}"; do
            IFS='=' read -r key value <<< "$env"
            if [[ "$key" != "" && "$value" != "" ]]; then
                path="${ENV_DIR}/${key}"
                echo "--> Writing ${path}..."
                echo -n "$value" > "$path"
            fi
        done
      volumeMounts:
        - name: layers-dir
          mountPath: /layers
        - name: $(params.PLATFORM_DIR)
          mountPath: /platform

    - name: create
      image: $(params.BUILDER_IMAGE)
      imagePullPolicy: Always
      command: ["/cnb/lifecycle/creator"]
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
        - name: CNB_INSECURE_REGISTRIES
          value: "$(params.CNB_INSECURE_REGISTRIES)"
      args:
        - "-app=$(workspaces.source.path)/$(params.SOURCE_SUBPATH)"
        - "-cache-dir=$(workspaces.cache.path)"
        - "-cache-image=$(params.CACHE_IMAGE)"
        - "-uid=$(params.USER_ID)"
        - "-gid=$(params.GROUP_ID)"
        - "-layers=/layers"
        - "-platform=/platform"
        - "-report=/layers/report.toml"
        - "-process-type=$(params.PROCESS_TYPE)"
        - "-skip-restore=$(params.SKIP_RESTORE)"
        - "-previous-image=$(params.APP_IMAGE)"
        - "-run-image=$(params.RUN_IMAGE)"
        - "$(params.APP_IMAGE)"
      volumeMounts:
        - name: layers-dir
          mountPath: /layers
        - name: $(params.PLATFORM_DIR)
          mountPath: /platform

    - name: results
      image: $(params.UTILITY_IMAGE)
      script: |
        #!/usr/bin/env bash
        set -eu

        # report.toml has an [image] table and, when buildpacks emit a BOM, a
        # preceding [build] table whose [[build.bom]] metadata may hold its own
        # `digest` key. Read `digest` from [image] only — a bare `grep digest`
        # would take whichever line comes first. Struct: buildpacks/lifecycle
        # platform/files/report.go (Report.Image.Digest).
        digest="$(awk '
          /^\[/            { in_image = ($0 ~ /^\[image\][ \t]*$/); next }
          in_image && $1 == "digest" {
            v = $0; sub(/^[^=]*=[ \t]*/, "", v); gsub(/[" \t]/, "", v)
            print v; exit
          }
        ' /layers/report.toml)"

        if [ -z "$digest" ]; then
          echo "buildpacks: no [image].digest in /layers/report.toml" >&2
          exit 1
        fi

        printf '%s' "$digest"             | tee "$(results.APP_IMAGE_DIGEST.path)"
        printf '%s' "$(params.APP_IMAGE)" | tee "$(results.APP_IMAGE_URL.path)"
      volumeMounts:
        - name: layers-dir
          mountPath: /layers

  volumes:
    - name: empty-dir
      emptyDir: {}
    - name: layers-dir
      emptyDir: {}
